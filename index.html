}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

  [aria-selected=&quot;true&quot;],

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

}

.btn:focus-visible {

  outline-offset: 2px;
}

  height: auto;

svg.lucide {

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;asp-igor-bi-v2&#x27;);
      if (!root) return;
      // DEMO_MODEL_START: one synthetic register drives counts, drill-down and exports.
      const demoDate = &#x27;2026-06-16&#x27;;
      const snapshotDates = Array.from({length:16},(_,i)=&gt;`2026-06-${String(i+1).padStart(2,&#x27;0&#x27;)}`);
      const stamp = minutes =&gt; `16.06.2026 ${String(Math.floor(minutes/60)).padStart(2,&#x27;0&#x27;)}:${String(minutes%60).padStart(2,&#x27;0&#x27;)}`;
      const statusBase = [
        {label:&#x27;Новый лид&#x27;,value:8,group:&#x27;new&#x27;,groupLabel:&#x27;Новый&#x27;},
        {label:&#x27;Первичный контакт&#x27;,value:31,group:&#x27;work&#x27;,groupLabel:&#x27;В работе&#x27;},
        {label:&#x27;Второе касание&#x27;,value:10,group:&#x27;work&#x27;,groupLabel:&#x27;В работе&#x27;},
        {label:&#x27;Третье касание&#x27;,value:2,group:&#x27;work&#x27;,groupLabel:&#x27;В работе&#x27;},
        {label:&#x27;Просили перезвонить&#x27;,value:5,group:&#x27;work&#x27;,groupLabel:&#x27;В работе&#x27;},
        {label:&#x27;Нецелевой&#x27;,value:10,group:&#x27;done&#x27;,groupLabel:&#x27;Завершена квалификация&#x27;},
        {label:&#x27;Нет ответа&#x27;,value:5,group:&#x27;done&#x27;,groupLabel:&#x27;Завершена квалификация&#x27;},
        {label:&#x27;Сейчас не актуально&#x27;,value:5,group:&#x27;done&#x27;,groupLabel:&#x27;Завершена квалификация&#x27;},
        {label:&#x27;Передан КМ&#x27;,value:4,group:&#x27;km&#x27;,groupLabel:&#x27;Передано КМ&#x27;}
      ];
      const states = statusBase.flatMap(state=&gt;Array(state.value).fill(state));
      const details = states.map((stage,i)=&gt;{
        const attempted = i&gt;=17;
        const connected = attempted &amp;&amp; stage.label!==&#x27;Нет ответа&#x27;;
        const transferred = stage.group===&#x27;km&#x27;;
        const kmIndex = i-76;
        const accepted = transferred &amp;&amp; kmIndex&lt;3;
        const failed = transferred &amp;&amp; kmIndex===3;
        const createdMinute = 9*60+i*2;
        const firstContactMinutes = 35+(i%8)*9;
        const handoffMinutes = 20+(i%4)*5;
        const acceptMinutes = accepted ? [27,42,84][kmIndex] : null;
        const firstKmMinutes = accepted ? acceptMinutes+5 : null;
        const transferMinute = createdMinute+firstContactMinutes+10+handoffMinutes;
        const quality = [];
        if (i&lt;3) quality.push(&#x27;Дубли&#x27;);
        if (i&gt;=56 &amp;&amp; i&lt;63) quality.push(&#x27;Технические и личные контакты&#x27;);
        if (i&lt;9) quality.push(&#x27;Без следующего дела&#x27;);
        if (i&gt;=9 &amp;&amp; i&lt;15) quality.push(&#x27;Просроченные дела&#x27;);
        return {
          recordId:`C-${String(i+1).padStart(3,&#x27;0&#x27;)}`,date:demoDate,snapshot:&#x27;16.06.2026&#x27;,
          leadId:`DEMO-L-${String(i+1).padStart(3,&#x27;0&#x27;)}`,company:`Демо-компания ${i+1}`,phone:`Демо-телефон ${String(i+1).padStart(3,&#x27;0&#x27;)}`,
          createdAt:stamp(createdMinute),firstAttemptAt:attempted?stamp(createdMinute+firstContactMinutes):&#x27;—&#x27;,
          connectedAt:connected?stamp(createdMinute+firstContactMinutes+10):&#x27;—&#x27;,transferredAt:transferred?stamp(transferMinute):&#x27;—&#x27;,
          acceptedAt:accepted?stamp(transferMinute+acceptMinutes):&#x27;—&#x27;,qualifier:`Квалификатор ${i%3===0?2:1}`,
          km:transferred?[&#x27;КМ 1&#x27;,&#x27;КМ 2&#x27;,&#x27;КМ 1&#x27;,&#x27;КМ 3&#x27;][kmIndex]:&#x27;—&#x27;,
          source:[&#x27;Звонок&#x27;,&#x27;Веб-форма&#x27;,&#x27;Рекомендация&#x27;,&#x27;Ручное создание&#x27;][i%4],base:[&#x27;Парсинг&#x27;,&#x27;Холодная база&#x27;,&#x27;Справочник&#x27;,&#x27;Конкурент А&#x27;][Math.floor(i/4)%4],
          qualification:transferred?&#x27;Целевой&#x27;:stage.group===&#x27;new&#x27;?&#x27;Не начата&#x27;:stage.group===&#x27;done&#x27;?stage.label:&#x27;В работе&#x27;,
          appealId:transferred?`DEMO-A-${kmIndex+1}`:&#x27;—&#x27;,orderId:transferred&amp;&amp;kmIndex&lt;2?`DEMO-Z-${kmIndex+1}`:&#x27;—&#x27;,
          dealId:transferred&amp;&amp;kmIndex===0?&#x27;DEMO-D-1&#x27;:&#x27;—&#x27;,
          appealState:failed?&#x27;Провалено&#x27;:transferred?(kmIndex===0?&#x27;Сделка закрыта&#x27;:&#x27;В работе&#x27;):&#x27;—&#x27;,
          failureReason:failed?&#x27;Клиент выбрал другого партнёра&#x27;:&#x27;—&#x27;,state:stage.label,
          attempts:attempted?6+(i&lt;38?1:0):0,next:i&lt;9?&#x27;—&#x27;:i&lt;15?&#x27;16.06.2026 18:00&#x27;:stage.group===&#x27;done&#x27;||failed||kmIndex===0?&#x27;—&#x27;:&#x27;17.06.2026 10:00&#x27;,
          quality,attempted,connected,transferred,accepted,failed,
          firstContactMinutes:attempted?firstContactMinutes:null,handoffMinutes:transferred?handoffMinutes:null,
          acceptMinutes,firstKmMinutes,lateAccepted:accepted&amp;&amp;acceptMinutes&gt;60,
          inProgress:accepted&amp;&amp;kmIndex&gt;0,created:true
        };
      });
      const contacts = [...details,...Array.from({length:4},(_,i)=&gt;({
        recordId:`C-${81+i}`,date:demoDate,snapshot:&#x27;16.06.2026&#x27;,leadId:&#x27;Не создан&#x27;,company:`Демо-контакт ${81+i}`,phone:`Демо-телефон ${81+i}`,
        qualifier:`Квалификатор ${i%2+1}`,km:&#x27;—&#x27;,source:&#x27;Звонок&#x27;,base:&#x27;Парсинг&#x27;,state:&#x27;Ожидает загрузки&#x27;,qualification:&#x27;Не начата&#x27;,quality:[],created:false
      }))];
      const metricPredicates = {
        provided:()=&gt;true,created:r=&gt;r.created,processed:r=&gt;r.attempted,attempted:r=&gt;r.attempted,
        connected:r=&gt;r.connected,transferred:r=&gt;r.transferred,autoAppeals:r=&gt;r.transferred,accepted:r=&gt;r.accepted,
        notAccepted:r=&gt;r.transferred&amp;&amp;!r.accepted,acceptedOnTime:r=&gt;r.accepted&amp;&amp;!r.lateAccepted,lateAccepted:r=&gt;r.lateAccepted,
        inProgress:r=&gt;r.inProgress,orders:r=&gt;r.created&amp;&amp;r.orderId!==&#x27;—&#x27;,deals:r=&gt;r.created&amp;&amp;r.dealId!==&#x27;—&#x27;,
        failures:r=&gt;r.transferred&amp;&amp;r.failed,queue:r=&gt;r.created&amp;&amp;!r.attempted,
        noNext:r=&gt;r.quality.includes(&#x27;Без следующего дела&#x27;),overdue:r=&gt;r.quality.includes(&#x27;Просроченные дела&#x27;),
        duplicates:r=&gt;r.quality.includes(&#x27;Дубли&#x27;),technicalContacts:r=&gt;r.quality.includes(&#x27;Технические и личные контакты&#x27;),qualityDiff:()=&gt;false,
        median:r=&gt;r.attempted,average:r=&gt;r.attempted,handoff:r=&gt;r.transferred,
        avgAccept:r=&gt;r.accepted,medianAccept:r=&gt;r.accepted,firstKmAction:r=&gt;r.accepted
      };
      const metricAliases = {processingCoverage:&#x27;processed&#x27;,callCoverage:&#x27;attempted&#x27;,reachRate:&#x27;connected&#x27;,transferRate:&#x27;transferred&#x27;,acceptanceRate:&#x27;accepted&#x27;,orderRate:&#x27;orders&#x27;,dealRate:&#x27;deals&#x27;,failRate:&#x27;failures&#x27;};
      const uniqueRows = rows =&gt; [...new Map(rows.map(row=&gt;[row.recordId,row])).values()];
      const average = values =&gt; values.length?Math.round(values.reduce((a,b)=&gt;a+b,0)/values.length):&#x27;—&#x27;;
      const median = values =&gt; { const sorted=[...values].sort((a,b)=&gt;a-b); const n=sorted.length; return n?Math.round((sorted[Math.floor((n-1)/2)]+sorted[Math.floor(n/2)])/2):&#x27;—&#x27;; };

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;

  const skipDelay = 300;
